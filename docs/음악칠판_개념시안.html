<button id="mt-play" style="flex:1;min-height:44px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;flex:none"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg> 듣기</button>

<script>
(function(){
var HOT='#D85A30',INK='var(--text-primary)',SUB='var(--text-secondary)';
var F=[261.63,293.66,329.63,349.23,392,440,493.88,523.25],BF=[277.18,311.13,369.99,415.3,466.16],PC=[0,2,4,5,7,9,11,0],SEL={0:1,2:1,4:1};
var CAP=['다장조 음계예요. 도에서 시작해 한 음씩 올라가요.','첫째, 셋째, 다섯째 음인 도·미·솔을 골라요.','세 음을 쌓아 함께 울리면 으뜸화음이 돼요.','직접 해보기: 건반에서 도·미·솔을 눌러 보세요.'];
var $=function(id){return document.getElementById(id)};
var s=0,hot={},found={},mine={},T=[],O=[],ac;
function tone(f,when,dur){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();var t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.05);O.push(o);}catch(e){}}
function later(fn,ms){T.push(setTimeout(fn,ms))}
function stop(){T.forEach(clearTimeout);T=[];O.forEach(function(o){try{o.stop()}catch(e){}});O=[];hot={};}
function hit(n,when,dur){tone(F[n],when,dur);later(function(){hot[n]=1;paint()},when*1000);later(function(){delete hot[n];paint()},(when+dur)*1000-60);}
function paint(){
for(var i=0;i<8;i++){var on=hot[i],pick=s>=1&&SEL[i];
$('mt-n'+i).style.color=(on||pick)?HOT:INK;
var l=$('mt-l'+i);l.style.fill=(on||pick)?HOT:SUB;l.style.fontWeight=pick?500:400;
var lit=s===3?mine[i]:pick;
$('mt-k'+i).style.fill=on?'#F0997B':lit?'#F5C4B3':'#F1EFE8';}
['mt-r0','mt-r2','mt-r4'].forEach(function(id){$(id).style.display=s>=1?'':'none'});
$('mt-chord').style.display=s>=2?'':'none';
}
function show(){stop();$('mt-count').textContent=(s+1)+' / 4';$('mt-cap').textContent=CAP[s];$('mt-msg').textContent='';$('mt-prev').style.visibility=s?'visible':'hidden';$('mt-next-t').textContent=s===3?'처음부터':'다음';paint();}
function play(){stop();paint();if(s===0)F.forEach(function(f,i){hit(i,i*0.36,0.5)});else if(s===1)[0,2,4].forEach(function(n,i){hit(n,i*0.55,0.8)});else[0,2,4].forEach(function(n){hit(n,0,1.6)});}
function tap(i,black){
tone(black?BF[i]:F[i],0,0.7);
if(black){var b=$('mt-b'+i);b.style.fill=HOT;setTimeout(function(){b.style.fill='#2C2C2A'},220);}
else{hot[i]=1;paint();setTimeout(function(){delete hot[i];paint()},220);}
if(s!==3)return;
var pc=black?-1:PC[i],m=$('mt-msg');
if(pc===0||pc===4||pc===7){var was=Object.keys(found).length;found[pc]=1;mine[i]=1;var n=Object.keys(found).length;
if(n===3&&was<3){m.style.color='var(--text-success)';m.textContent='맞아요. 도·미·솔이 함께 울리는 소리가 으뜸화음이에요.';later(function(){[0,2,4].forEach(function(k){hit(k,0,1.6)})},500);}
else if(n<3){m.style.color=SUB;m.textContent=n+' / 3 찾았어요.';}
paint();}
else{m.style.color='var(--text-danger)';m.textContent='그 음은 으뜸화음에 없어요. 도·미·솔을 찾아보세요.';}
}
$('mt-next').addEventListener('click',function(){s=s===3?0:s+1;if(s===0||s===3){found={};mine={};}show()});
$('mt-prev').addEventListener('click',function(){if(s>0){s--;show()}});
$('mt-play').addEventListener('click',play);
for(var i=0;i<8;i++)(function(i){$('mt-k'+i).addEventListener('click',function(){tap(i,false)})})(i);
for(var j=0;j<5;j++)(function(j){$('mt-b'+j).addEventListener('click',function(){tap(j,true)})})(j);
show();
})();
</script>

<p class="note">이 파일은 구상 단계의 스케치입니다. 실제 앱은 오선보를 VexFlow로 그리고, 수업 대본(데이터)에서 악보·소리·자막을 자동으로 만듭니다. 소리가 나지 않으면 기기 볼륨과 무음 모드를 확인해 주세요.</p>
