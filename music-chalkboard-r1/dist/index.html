<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음악교육 인터렉티브 화이트보드</title>
<style>:root {
  --bg: #f3f0e8;
  --ink: #1d2a24;
  --muted: #5b6a62;
  --card: #ffffff;
  --line: #d8d2c4;
  --brand: #2f6f5e;
  --ok: #1f7a4d;
  --bad: #b3261e;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; -webkit-text-size-adjust: 100%; line-height: 1.5; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.03em; white-space: nowrap; }
h2 { font-size: 14px; margin: 0 0 8px; }

/* 버튼과 설정 메뉴를 헤더에 모은다. */
.app-header { position: relative; z-index: 10; display: flex; flex: 0 0 auto; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; padding: 8px clamp(10px, 2vw, 26px); background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 3px 14px rgba(0,0,0,.08); }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: #fff; font-size: 20px; font-weight: 700; }
.header-nav { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.menu { position: relative; }
.menu > summary, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); padding: 6px 13px; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; list-style: none; white-space: nowrap; }
.menu > summary::-webkit-details-marker { display: none; }
.menu[open] > summary { border-color: var(--brand); }
.btn { border-color: var(--brand); background: var(--brand); color: #fff; }
.btn.ghost { background: var(--card); color: var(--brand); }
.menu > summary:focus-visible, .btn:focus-visible, .seg button:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
.dropdown { position: absolute; top: calc(100% + 8px); right: 0; width: min(420px, calc(100vw - 24px)); max-height: min(75dvh, 680px); overflow-y: auto; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 14px 32px rgba(0,0,0,.18); }
.settings { width: min(390px, calc(100vw - 24px)); }
.row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.row[data-disabled="true"] { opacity: .45; }
.lab { flex: 0 0 48px; font-size: 12.5px; color: var(--muted); }
.seg { display: flex; flex: 1; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: #f7f5ef; }
.seg button { flex: 1; min-height: 40px; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 13.5px; padding: 6px 4px; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; font-weight: 600; }
.seg button:disabled { cursor: not-allowed; }
.status { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.hud { background: #f8f8f5; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
.hud dl { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px; margin: 0 0 8px; }
.hud dt { font-size: 11.5px; color: var(--muted); }
.hud dd { margin: 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hud p { margin: 0; font-size: 12.5px; color: var(--muted); }
.hud[data-verdict="pass"] { border-color: var(--ok); }
.hud[data-verdict="pass"] #hudVerdict { color: var(--ok); font-weight: 600; }
.hud[data-verdict="ok"] { border-color: #b7791f; }
.hud[data-verdict="ok"] #hudVerdict { color: #8a5a00; font-weight: 600; }
.hud[data-verdict="fail"] { border-color: var(--bad); }
.hud[data-verdict="fail"] #hudVerdict { color: var(--bad); font-weight: 600; }
.info { font-size: 13px; line-height: 1.6; }
.info ol { margin: 8px 0 2px; padding-left: 20px; }
.note { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }

/* 실제 칠판 비율을 보존하면서 헤더를 제외한 공간에 최대 크기로 맞춘다. */
.board-area { flex: 1 1 auto; min-height: 0; min-width: 0; display: grid; place-items: center; padding: clamp(6px, 1.2vw, 16px); container-type: size; }
.frame { --scene-aspect: 1.612903; width: min(100%, calc((100vh - 110px) * var(--scene-aspect) + 18px)); width: min(100%, calc((100cqh - 18px) * var(--scene-aspect) + 18px)); border-radius: 12px; padding: 9px; box-shadow: 0 6px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25); }
.frame[data-theme="chalk"] { background: linear-gradient(180deg, #96744c, #6a4b2e); }
.frame[data-theme="white"] { background: linear-gradient(180deg, #dfe4e8, #b8c1c7); }
.stage { position: relative; width: 100%; overflow: hidden; border-radius: 5px; contain: layout paint; }
#boardTex, #ink, #dust { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#ink > svg, #ink > canvas { width: 100%; height: 100%; display: block; }
#dust { pointer-events: none; }
.hand, .hand-shadow { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
.hand-inner { position: absolute; }
.hand-inner > svg { display: block; overflow: visible; }
.hand-shadow { background: radial-gradient(closest-side, rgba(0,0,0,.5), rgba(0,0,0,0)); }
.frame[data-theme="white"] .hand-shadow { background: radial-gradient(closest-side, rgba(20,40,50,.34), rgba(20,40,50,0)); }
.hand.pen-only .body { display: none; }
@media (max-width: 700px) {
  .app-header { gap: 6px 8px; padding: 7px 10px; }
  .brand { width: 100%; }
  .header-nav { width: 100%; gap: 5px; }
  .menu > summary, .btn { min-height: 39px; padding: 5px 9px; font-size: 12.5px; }
  .menu { position: static; }
  .dropdown, .settings { left: 8px; right: 8px; top: calc(100% + 4px); width: auto; max-height: min(65dvh, 560px); }
  .board-area { padding: 6px; }
}
@media (max-height: 430px) {
  .brand { width: auto; }
  .app-header { padding-block: 4px; }
  .menu > summary, .btn { min-height: 34px; }
  .board-area { padding: 4px; }
}
@media (prefers-reduced-motion: reduce) { .hand, .hand-shadow { will-change: auto; } }
.scene-indicator { flex: 1 1 140px; min-width: 0; display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.scene-indicator strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.menu-actions { display: grid; gap: 4px; width: min(260px, calc(100vw - 24px)); }
.menu-actions button { width: 100%; min-height: 42px; border: 0; border-radius: 7px; text-align: left; padding: 8px 10px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
.menu-actions button:hover, .menu-actions button:focus-visible { background: #e7f0eb; }
.menu-actions button:disabled { opacity: .45; cursor: not-allowed; }
.menu-actions hr { border: 0; border-top: 1px solid var(--line); width: 100%; }
.menu-actions select, .info select { min-height: 40px; font: inherit; }
[hidden] { display: none !important; }
@media (max-width: 700px) { .brand { width: auto; } .scene-indicator { flex: 1; } .header-nav { width: 100%; } }

.draft-dialog { width:min(680px,95vw); border:0; border-radius:16px; padding:24px; color:var(--ink); max-height:85dvh; }
.draft-dialog::backdrop { background:#10241dcc; }
.draft-row { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
.draft-row span { flex:1 1 230px; }
.draft-dialog button { min-height:42px; padding:8px 12px; margin:4px; font:inherit; border:1px solid var(--line); border-radius:8px; background:white; cursor:pointer; }

.header-search { display:flex; flex:0 1 210px; min-width:130px; }
.header-search input { width:100%; min-width:0; min-height:42px; border:1px solid var(--line); border-radius:9px 0 0 9px; padding:7px 10px; font:inherit; }
.header-search button { min-height:42px; border:1px solid var(--line); border-left:0; background:#fff; border-radius:0 9px 9px 0; padding:6px 10px; font:inherit; cursor:pointer; }
@media(max-width:700px) { .header-search { order:3; flex:1 1 100%; } }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand"><span aria-hidden="true" class="brand-icon">♪</span><h1>음악 칠판</h1></div>
  <div class="scene-indicator"><strong id="sceneTitle">장면 준비 중</strong><span id="progress" aria-live="polite"></span></div>
  <form id="sceneSearchForm" class="header-search" role="search"><input id="sceneSearch" type="search" placeholder="장면 검색" aria-label="장면 검색"><button type="submit" aria-label="검색">검색</button></form>
  <nav class="header-nav" aria-label="판서 도구">
    <details id="sceneMenu" class="menu" name="header-menu"><summary>장면 ▾</summary><div class="dropdown menu-actions">
      <button id="openScenes">내 장면 열기</button><button id="newScene">새 장면</button><button id="duplicateScene">현재 장면 복제</button><button id="recoverDraft">초안 복구</button><button id="editScene">내용 편집</button>
      <hr><button id="importScenes">파일 가져오기</button><button id="exportScene">현재 장면 내보내기</button><button id="exportAll">전체 백업</button>
    </div></details>
    <details class="menu" name="header-menu"><summary>판서 ▾</summary><div class="dropdown menu-actions">
      <button id="previousStep">← 이전 단계</button><button id="nextStep">→ 다음 단계</button><button id="togglePlay">재생 · 일시정지</button><button id="previousScene">이전 장면</button><button id="nextScene">다음 장면</button><button id="restart">처음부터</button><button id="finish">이 장면 바로 완성</button>
      <hr><label for="playMode">진행 방식</label><select id="playMode"><option value="step">단계별 진행</option><option value="auto">지정 대기 자동</option><option value="continuous">대기 없이 전체 보기</option></select>
    </div></details>
    <details class="menu" name="header-menu"><summary>보기 ▾</summary><section class="dropdown settings" aria-label="보기 설정">
      <div class="row"><span class="lab">판</span><div class="seg" data-opt="theme"><button type="button" data-v="chalk">칠판</button><button type="button" data-v="white">화이트보드</button></div></div>
      <div class="row"><span class="lab">손</span><div class="seg" data-opt="hand"><button type="button" data-v="hand">손 + 펜</button><button type="button" data-v="pen">펜만</button></div></div>
      <div class="row"><span class="lab">가루</span><div class="seg" data-opt="dust"><button type="button" data-v="on">날림</button><button type="button" data-v="off">없음</button></div></div>
      <div class="row"><span class="lab">속도</span><div class="seg" data-opt="speed"><button type="button" data-v="slow">느리게</button><button type="button" data-v="normal">보통</button><button type="button" data-v="fast">빠르게</button></div></div>
    </section></details>
    <details class="menu" name="header-menu"><summary>도움말 ▾</summary><div class="dropdown info"><p id="status" role="status" aria-live="polite">준비 중…</p><p>방향키 또는 Page Up/Down으로 단계를 이동하고, 스페이스바로 재생과 일시정지를 전환합니다.</p><p>내 장면은 이 브라우저에 저장됩니다. 다른 기기에서 사용하려면 백업 파일을 내보내고 가져오세요.</p><label for="method">선 방식</label> <select id="method"><option value="svg">벡터 선</option><option value="canvas">붓 도장</option></select><p class="note">글씨 윤곽: 개구체(Gaegu), SIL Open Font License 1.1.</p></div></details>
  </nav>
  <button id="returnPreview" class="btn" hidden>미리보기 종료 · 편집으로 돌아가기</button>
</header>
<main class="board-area" aria-label="음악 판서 보드"><div id="frame" class="frame" data-theme="chalk"><div id="stage" class="stage"><canvas id="boardTex" aria-hidden="true"></canvas><div id="ink"></div><canvas id="dust" aria-hidden="true"></canvas></div></div></main>
<input id="fileImport" type="file" accept="application/json,.json" hidden>

.wb-scenes { border:0; padding:0; border-radius:18px; width:min(960px,calc(100vw - 28px)); max-width:none; max-height:min(88vh,900px); color:#263b34; background:#fffefa; box-shadow:0 20px 70px #071b1490; font:15px/1.5 system-ui,sans-serif; }
.wb-scenes::backdrop { background:#142d25ad; }
.wb-scenes * { box-sizing:border-box; }
.wb-scenes header { position:sticky; top:0; z-index:1; padding:18px 20px 12px; background:#fffefa; border-bottom:1px solid #dce7df; }
.wb-scenes h2 { font-size:1.25rem; margin:0; }
.wb-scenes .wb-title { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.wb-scenes .wb-toolbar,.wb-scenes .wb-tabs,.wb-scenes .wb-actions,.wb-scenes .wb-row-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.wb-scenes .wb-toolbar,.wb-scenes .wb-tabs { margin-top:12px; }
.wb-scenes input,.wb-scenes select { min-height:38px; border:1px solid #aebeb4; border-radius:8px; padding:7px 10px; background:white; color:#22372e; font:inherit; }
.wb-scenes input[type=search] { flex:1; min-width:180px; }
.wb-scenes button { min-height:36px; border:1px solid #b2c3b7; background:#fff; color:#254a38; border-radius:8px; padding:6px 11px; cursor:pointer; font:inherit; }
.wb-scenes button:hover { background:#eff8f1; }
.wb-scenes button:focus-visible,.wb-scenes input:focus-visible,.wb-scenes select:focus-visible { outline:3px solid #e5a300; outline-offset:2px; }
.wb-scenes button[aria-selected=true],.wb-scenes .wb-primary { background:#245c40; color:white; border-color:#245c40; }
.wb-scenes button:disabled { opacity:.45; cursor:not-allowed; }
.wb-scenes .wb-content { padding:12px 20px 20px; }
.wb-scenes .wb-hint { color:#5b6e63; font-size:.88rem; margin:8px 0; }
.wb-scenes .wb-error { color:#a32621; white-space:pre-wrap; }
.wb-scenes ul { padding:0; margin:0; list-style:none; display:grid; gap:8px; }
.wb-scenes li { border:1px solid #dce7df; border-radius:12px; padding:12px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
.wb-scenes li > div:first-child { min-width:0; }
.wb-scenes strong { overflow-wrap:anywhere; font-size:1rem; }
.wb-scenes .wb-meta { font-size:.83rem; color:#607169; overflow-wrap:anywhere; margin-top:3px; }
.wb-scenes .wb-row-actions { justify-content:flex-end; }
.wb-scenes .wb-row-actions button { font-size:.87rem; }
.wb-scenes .wb-empty { padding:26px 4px; text-align:center; color:#607169; }
@media(max-width:600px) { .wb-scenes { width:100vw; height:100dvh; max-height:none; border-radius:0; } .wb-scenes header { padding:14px; } .wb-scenes .wb-content { padding:12px 14px; } .wb-scenes li { align-items:flex-start; flex-direction:column; } .wb-scenes .wb-row-actions { justify-content:flex-start; } }
